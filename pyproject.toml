[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "edusentrix-school-miner"
version = "0.1.0"
description = "Internal CLI for acquiring, cleaning, validating, and exporting Ghanaian school directory data."
requires-python = ">=3.9"
dependencies = [
    "typer",
    "rich",
    "httpx",
    "beautifulsoup4",
    "lxml",
    "pydantic",
    "phonenumbers",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
schoolminer = "schoolminer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
ignore = ["UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
